# Code generated by Hey API. DO NOT EDIT.

name: Hey API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate.yml
      - .github/workflows/publish.yaml
      - .hey-api/**
      - hey-api.config.json
      - packages/api-spec/src/openapi.json
  schedule:
    - cron: 26 6 * * 1
  workflow_dispatch:
    inputs:
      task:
        description: generate commits each package into its repository, publish ships what each one holds without waiting for a release, upgrade moves Hey API to its latest release
        required: false
        default: generate
        type: choice
        options:
          - generate
          - publish
          - upgrade
      bump:
        description: Version bump for each package that changed, at the least. derive derives it from the contract diff. publish and upgrade ignore it
        required: false
        default: derive
        type: choice
        options:
          - derive
          - patch
          - minor
          - major
      adopt:
        description: 'Only to move an existing SDK repository to Hey API: its owner/name. Lets this run commit over what that repository holds. Otherwise leave blank.'
        required: false
        type: string
      breaking:
        description: 'Only to ship a breaking change without a major version: the name of the one package allowed to. Otherwise leave blank.'
        required: false
        type: string
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    if: github.event_name == 'push' || inputs.task == 'generate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Use npm 11.19.0, since trusted publishing needs 11.5.1 or later
        run: npm install --global npm@11.19.0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check the GitHub App is connected
        env:
          CLIENT_ID: ${{ vars.HEY_API_APP_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then exit 0; fi
          echo "::error::No GitHub App connected yet. Run 'npx --yes --registry https://npm.pkg.heyapi.dev/ hey-api@0.1.0-elmo.4 init' and approve it in a browser, then push again or re-run this workflow."
          exit 1

      - name: Get a token from the GitHub App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEY_API_APP_CLIENT_ID }}
          owner: elmohq
          private-key: ${{ secrets.HEY_API_APP_PRIVATE_KEY }}

      - name: Release and commit each package that changed, to publish when Release succeeds
        run: npx --yes --registry https://npm.pkg.heyapi.dev/ hey-api@0.1.0-elmo.4 publish --generate ${BUMP:+--bump "$BUMP"} ${BREAKING:+--breaking "$BREAKING"} ${ADOPT:+--adopt "$ADOPT"}
        env:
          npm_config_//npm.pkg.heyapi.dev/:_authToken: ${{ secrets.HEY_API_PKG_TOKEN }}
          HEY_API_PKG_TOKEN: ${{ secrets.HEY_API_PKG_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ADOPT: ${{ inputs.adopt }}
          BREAKING: ${{ inputs.breaking }}
          BUMP: ${{ inputs.bump != 'derive' && inputs.bump || '' }}

  upgrade:
    if: github.event_name == 'schedule' || inputs.task == 'upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check the GitHub App is connected
        env:
          CLIENT_ID: ${{ vars.HEY_API_APP_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then exit 0; fi
          echo "::error::No GitHub App connected yet. Run 'npx --yes --registry https://npm.pkg.heyapi.dev/ hey-api@0.1.0-elmo.4 init' and approve it in a browser, then push again or re-run this workflow."
          exit 1

      - name: Get a token from the GitHub App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEY_API_APP_CLIENT_ID }}
          owner: elmohq
          private-key: ${{ secrets.HEY_API_APP_PRIVATE_KEY }}

      - name: Open a pull request moving Hey API to its latest release
        run: npx --yes --registry https://npm.pkg.heyapi.dev/ hey-api@0.1.0-elmo.4 upgrade
        env:
          npm_config_//npm.pkg.heyapi.dev/:_authToken: ${{ secrets.HEY_API_PKG_TOKEN }}
          HEY_API_PKG_TOKEN: ${{ secrets.HEY_API_PKG_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token }}

  publish:
    if: '(github.event_name == ''workflow_run'' && github.event.workflow_run.conclusion == ''success'') || inputs.task == ''publish'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check the GitHub App is connected
        env:
          CLIENT_ID: ${{ vars.HEY_API_APP_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then exit 0; fi
          echo "::error::No GitHub App connected yet. Run 'npx --yes --registry https://npm.pkg.heyapi.dev/ hey-api@0.1.0-elmo.4 init' and approve it in a browser, then push again or re-run this workflow."
          exit 1

      - name: Get a token from the GitHub App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEY_API_APP_CLIENT_ID }}
          owner: elmohq
          private-key: ${{ secrets.HEY_API_APP_PRIVATE_KEY }}

      - name: Publish each package from its own repository
        run: npx --yes --registry https://npm.pkg.heyapi.dev/ hey-api@0.1.0-elmo.4 publish --wait
        env:
          npm_config_//npm.pkg.heyapi.dev/:_authToken: ${{ secrets.HEY_API_PKG_TOKEN }}
          HEY_API_PKG_TOKEN: ${{ secrets.HEY_API_PKG_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
