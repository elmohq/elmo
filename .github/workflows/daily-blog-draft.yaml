name: Daily Blog Draft

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  draft:
    name: Research and draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Elmo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set run date
        id: date
        run: |
          date -u '+date=%F' >> "$GITHUB_OUTPUT"
          echo "label=$(date -u '+%B %-d' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Discover current AEO signals
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
        run: |
          node .github/blog-agent/discover.mjs \
            --lookback-days 7 \
            --output .agents/blog-candidates.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Log discovered candidates
        run: cat .agents/blog-candidates.json

      - name: Collect previously rejected topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state closed --search "daily blog post" --limit 60 \
            --json title,mergedAt,files \
            --jq '.[] | select(.mergedAt == null) | .files[].path' \
            | sort -u > .agents/rejected-topics.txt
          cat .agents/rejected-topics.txt

      # Reviewed 2026-07-24. Keep this SHA pinned and review upstream changes
      # before updating it; these files become instructions for the writing agent.
      - name: Checkout pinned marketing skills
        uses: actions/checkout@v7
        with:
          repository: coreyhaines31/marketingskills
          ref: c21a984a56da10fb6085e6334f6f60929220a4da
          path: .agents/marketingskills
          sparse-checkout: |
            skills/ai-seo
            skills/content-strategy
            skills/copywriting

      - name: Install reviewed skills for this run
        run: |
          for skill in ai-seo content-strategy copywriting
          do
            target=".claude/skills/$skill"
            if [ -e "$target" ]
            then
              echo "Refusing to overwrite $target"
              exit 1
            fi
            cp -R ".agents/marketingskills/skills/$skill" "$target"
            echo "/$target/" >> .git/info/exclude
          done

      - name: Decide whether to create or refresh a post
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          display_report: true
          prompt: |
            Use /content-strategy, /ai-seo, and /copywriting.

            Read .agents/blog-candidates.json. List the posts in packages/docs/content/blog/ and read relevant posts as needed. Read .agents/rejected-topics.txt — those drafts were reviewed and turned down; do not propose the same topic again.

            Start from a question an in-house marketing, SEO, or growth team is already asking — not from a news item. The candidates are evidence for answering such a question, not the subject. If today's research updates an answer we have already published, refresh that post instead of writing a new one.

            Verify every claim against the primary source with WebSearch and WebFetch. Trade-press coverage points at a source; it is never the source. If you cannot reach the original study, paper, filing, or documentation, drop the topic.

            Publish a new post only if all of these hold:
            - The title is a question or claim a reader would search for, and the slug reads as an evergreen topic rather than an event or a vendor's product name.
            - Either three or more independent datasets bear on the question — reconciled, with disagreements explained — or the single source is a preprint, peer-reviewed paper, or first-party dataset large enough to carry a post alone. One SEO or AEO vendor's study is not enough by itself.
            - The post adds something the sources do not: a number from our own tracking, a reconciliation of conflicting figures, a limitation the source glosses over, or a decision rule the reader can apply. Restating findings and appending takeaways does not count.
            - The subject is a brand's presence in AI answers. Skip local-business SEO, paid-media mechanics, and arguments about whether AI visibility measurement is a legitimate category.

            Never build a post around a competitor's study, index, or survey. Citing one among several corroborating sources is fine; making it the spine is not.

            Blog conventions:
            - Only add or edit one MDX file in packages/docs/content/blog/.
            - For a new post, use date "${{ steps.date.outputs.date }}" and author: ai.
            - Only refresh posts with author: ai. Preserve their original date and author and set updated: "${{ steps.date.outputs.date }}".
            - Follow the frontmatter, structure, tone, citations, and internal-linking conventions in the existing posts.
            - Do not add an H1, imports, scripts, placeholders, fabricated claims, or a changeset.

            If nothing is worth publishing, make no changes.
          claude_args: |
            --model claude-fable-5
            --max-budget-usd 5.00
            --tools "Read,Glob,Grep,Write,Edit,WebSearch,WebFetch,Skill"
            --allowedTools "Read,Glob,Grep,Write,Edit,WebSearch,WebFetch,Skill"
            --disallowedTools "Bash,NotebookEdit,Task"

      - name: Prepare pull request details
        run: |
          mkdir -p .agents
          : > .agents/pr-body.md

          change="$(git status --porcelain=v1 --untracked-files=all -- packages/docs/content/blog | head -n 1)"
          status="${change:0:2}"
          path="${change:3}"

          if [ -n "$path" ]
          then
            frontmatter() {
              sed -n "s/^$1:[[:space:]]*//p" "$path" | head -n 1 | sed -E "s/^[\"']//; s/[\"']$//"
            }
            if [ "$status" = "??" ]
            then
              frontmatter description > .agents/pr-body.md
            else
              printf 'Updated "%s".\n' "$(frontmatter title)" > .agents/pr-body.md
            fi
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Check marketing site types
        run: pnpm --filter @workspace/www check-types

      - name: Build marketing site
        run: pnpm --filter @workspace/www build

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: automation/daily-aeo-blog-${{ github.run_id }}
          delete-branch: true
          add-paths: packages/docs/content/blog/*.mdx
          commit-message: daily blog post (${{ steps.date.outputs.label }})
          title: daily blog post (${{ steps.date.outputs.label }})
          body-path: .agents/pr-body.md
