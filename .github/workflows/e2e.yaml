# End-to-End Integration Tests
#
# Verifies every deployment mode works end-to-end.
# Walks through the `elmo init --dev` CLI flow in CI mode, then runs in five
# phases against the Dockerized stack:
#
#   1. local — worker down, seed data, run the `local` Playwright project
#      (shared specs + local-only specs) and the Bruno API suite
#   2. worker — start the worker (pointed at the no-network `stub` provider)
#      and run the `worker` project, which submits a job and asserts the worker
#      processes it
#   3. cloud — worker back down, recreate `web` with e2e/modes/cloud.yaml,
#      re-seed, run the `cloud` project
#   4. whitelabel — same with e2e/modes/whitelabel.yaml
#   5. demo — same with e2e/modes/demo.yaml
#
# The mode phases only recreate `web`: DEPLOYMENT_MODE is read at runtime, so
# one image serves all of them. Ordering matters — the fixture suites run while
# the worker is down so its self-healing scheduler can't mutate seeded data,
# and the local phase runs first because it bootstraps the account the other
# modes sign in with.
#
# This workflow is the SINGLE SOURCE OF TRUTH for E2E test orchestration.
# Run locally via: pnpm test:e2e-local  (replays this workflow with
# https://github.com/nektos/act); `pnpm test:e2e`, `pnpm test:e2e:cloud`,
# `pnpm test:e2e:whitelabel`, and `pnpm test:e2e:demo` run one mode's specs
# against an already-running stack in that mode.

name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Integration Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45

    env:
      # One file set for every `docker compose` invocation below, so no step
      # can silently run against a different effective config. The override
      # scopes the worker to the no-network stub provider. The mode phases
      # append their own override on top of this.
      COMPOSE_FILE: e2e/.elmo/elmo.yaml:e2e/worker-override.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # NB: no free-disk-space step here — it predated the Blacksmith migration
      # and is unnecessary on these runners (publish.yaml builds the same
      # Dockerfile without it). We also deliberately do NOT use a buildx
      # sticky-disk builder: `docker compose build` doesn't wire up its cache,
      # and the container driver would serialize each image to load it back into
      # the local daemon for `up` — that export/import tax outweighs any cache
      # savings for this build-and-run-locally job. The default driver builds
      # straight into the daemon's image store.

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm turbo check-types

      - name: Unit tests
        run: pnpm turbo test

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm -C apps/web exec playwright install chromium --with-deps

      - name: Storybook tests
        run: pnpm -C apps/web test:storybook

      - name: Build elmo CLI
        run: pnpm -C apps/cli build

      - name: "Run: elmo init --dev (via cli-driver)"
        run: |
          mkdir -p e2e/.elmo
          cd e2e
          npx tsx cli-driver.ts "$PWD/.elmo" "$GITHUB_WORKSPACE"

      - name: Patch .env with test overrides
        run: |
          cat >> e2e/.elmo/.env <<'PATCH'

          # E2E test overrides
          ADMIN_API_KEYS=test-api-key-e2e
          ONBOARDING_LLM_TARGET=stub:stub
          SENTRY_DSN=https://examplePublicKey@o0.ingest.sentry.io/0
          PATCH

      - name: Show generated config
        run: |
          echo "=== .env ==="
          cat e2e/.elmo/.env
          echo ""
          echo "=== elmo.yaml (services) ==="
          grep -E '^\s{2}\w' e2e/.elmo/elmo.yaml || true

      # Build all images so a broken worker (or db-migrate) Dockerfile fails CI
      # here. web/worker/migrate share the base/deps/builder stages, so BuildKit
      # builds those once — building all three costs little more than building
      # web alone. postgres is an image pull, so `build` skips it.
      - name: Build images
        run: docker compose build

      # Start web only (with its deps db-migrate + postgres). The worker stays
      # down for now — it comes up in phase 2, after the fixture suites run.
      - name: Start web
        run: docker compose up -d --no-build web

      - name: Wait for web
        run: bash e2e/wait-for-web.sh

      - name: Seed test data
        run: cd e2e && npx tsx seed.ts

      # Phase 1 — local mode, worker still down. Run everything that reads the
      # seeded fixtures, so no background job can mutate them mid-suite. This
      # phase also bootstraps the account the later modes sign in with.
      - name: Run Playwright E2E tests (local mode)
        run: pnpm -C e2e exec playwright test --project=local
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-local

      - name: Run Bruno API tests
        run: pnpm test:api

      # Phase 2 — bring the worker up and prove it processes a submitted job.
      # No readiness wait: the job the spec submits is durable in pg-boss, so
      # the spec's own DB poll absorbs worker startup.
      - name: Start worker
        run: docker compose up -d --no-build worker

      # `github` keeps PR annotations on failure; omitting `html` leaves the
      # per-mode playwright-report-* directories untouched for the upload below.
      - name: Run worker job-processing test
        run: pnpm -C e2e exec playwright test --project=worker --reporter=list,github

      - name: Dump worker logs
        if: failure()
        run: docker compose logs worker

      # Phase 3+ — the remaining deployment modes. The worker goes back down so
      # its scheduler can't touch the re-seeded fixtures, then `web` is
      # recreated with the mode's env overlay. `--no-deps` keeps the recreate
      # off postgres, so the bootstrapped account and its session survive.
      - name: Stop worker
        run: docker compose stop worker

      - name: Switch web to cloud mode
        env:
          COMPOSE_FILE: e2e/.elmo/elmo.yaml:e2e/worker-override.yaml:e2e/modes/cloud.yaml
        run: |
          docker compose up -d --no-build --no-deps --force-recreate web
          bash e2e/wait-for-web.sh

      - name: Re-seed test data
        run: cd e2e && npx tsx seed.ts

      - name: Run Playwright E2E tests (cloud mode)
        run: pnpm -C e2e exec playwright test --project=cloud
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-cloud

      - name: Switch web to whitelabel mode
        env:
          COMPOSE_FILE: e2e/.elmo/elmo.yaml:e2e/worker-override.yaml:e2e/modes/whitelabel.yaml
        run: |
          docker compose up -d --no-build --no-deps --force-recreate web
          bash e2e/wait-for-web.sh

      - name: Re-seed test data
        run: cd e2e && npx tsx seed.ts

      - name: Run Playwright E2E tests (whitelabel mode)
        run: pnpm -C e2e exec playwright test --project=whitelabel
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-whitelabel

      # Demo has no signup, so it reuses the account the local phase
      # bootstrapped — the same way the public demo reuses a local install's
      # database. It writes nothing, so it goes last.
      - name: Switch web to demo mode
        env:
          COMPOSE_FILE: e2e/.elmo/elmo.yaml:e2e/worker-override.yaml:e2e/modes/demo.yaml
        run: |
          docker compose up -d --no-build --no-deps --force-recreate web
          bash e2e/wait-for-web.sh

      - name: Re-seed test data
        run: cd e2e && npx tsx seed.ts

      - name: Run Playwright E2E tests (demo mode)
        run: pnpm -C e2e exec playwright test --project=demo
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-demo

      - name: Dump web logs
        if: failure()
        run: docker compose logs web

      - name: Upload Playwright reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report-*/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            e2e/test-results/
            e2e/test-results-local/
            e2e/test-results-cloud/
            e2e/test-results-whitelabel/
            e2e/test-results-demo/
            e2e/test-results-worker/
          retention-days: 7
