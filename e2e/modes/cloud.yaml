# Compose override that runs the E2E stack in cloud mode.
#
# Layered on top of the generated .elmo/elmo.yaml, which supplies the local
# .env; `environment` wins over `env_file`, so only the cloud-specific values
# live here. Drop this file from COMPOSE_FILE and recreate `web` to go back to
# local mode.
#
# Every credential is a placeholder: cloud requires Stripe, Resend, and Google
# OAuth to be configured (env validation fails the app without them), but no
# E2E assertion calls those services. Verification emails do get attempted and
# fail — better-auth logs the failure and completes the signup regardless, so
# the suite covers cloud signup without a real email provider.
#
# Web only: the worker keeps the local .env so the worker phase is unaffected.
services:
  web:
    environment:
      DEPLOYMENT_MODE: cloud
      VITE_DEPLOYMENT_MODE: cloud
      # Admits the E2E user plus the two domains e2e/tests/cloud uses. The
      # disposable domain is allowlisted on purpose, so the disposable-address
      # rejection is reached rather than masked by the invite-only gate.
      CLOUD_SIGNUP_ALLOWLIST: "e2e@test.local,@e2e-allowed.test,@mailinator.com"
      STRIPE_SECRET_KEY: sk_test_e2e_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_e2e_placeholder
      RESEND_API_KEY: re_e2e_placeholder
      RESEND_FROM_EMAIL: Elmo E2E <e2e@example.test>
      GOOGLE_CLIENT_ID: e2e-google-client-id
      GOOGLE_CLIENT_SECRET: e2e-google-client-secret
