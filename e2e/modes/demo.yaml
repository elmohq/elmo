# Compose override that runs the E2E stack in demo mode.
#
# Layered on top of the generated .elmo/elmo.yaml, which supplies the local
# .env; `environment` wins over `env_file`, so only DEPLOYMENT_MODE changes.
# Drop this file from COMPOSE_FILE and recreate `web` to go back to local mode.
#
# Demo is local with READ_ONLY forced on, and it deliberately reuses a database
# bootstrapped in local mode — signup is disabled, so the account the specs sign
# in with has to already exist. That mirrors how the public demo is deployed and
# is why the demo phase runs after the local one in CI.
#
# Web only: the worker keeps the local .env so the worker phase is unaffected.
services:
  web:
    environment:
      DEPLOYMENT_MODE: demo
      VITE_DEPLOYMENT_MODE: demo
