# The package itself (src/elmohq_sdk) is generated by Fern; run `pnpm
# generate:sdk` from the repo root. This file and the version in it are not.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "elmohq-sdk"
version = "0.4.4"
description = "Python SDK for the Elmo API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=1.9.2",
    "typing_extensions>=4.0.0",
]

[project.urls]
Repository = "https://github.com/elmohq/elmo"

[tool.hatch.build.targets.wheel]
packages = ["src/elmohq_sdk"]
exclude = ["src/elmohq_sdk/tests"]
