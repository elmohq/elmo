packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

catalog:
  "@base-ui/react": "^1.9.0"
  "@better-auth/stripe": "^1.7.13"
  "@fontsource/geist-mono": "^5.3.0"
  "@fontsource/geist-sans": "^5.3.0"
  "@fontsource/titan-one": "^5.3.0"
  "@modelcontextprotocol/sdk": "^1.32.2"
  "@tailwindcss/typography": "^0.5.20"
  "@tailwindcss/vite": "^4.3.3"
  "@takumi-rs/core": "^2.17.1"
  "@tanstack/react-router": "^1.170.46"
  "@tanstack/react-start": "^1.169.4"
  "@types/node": "^26.6.5"
  "@types/pg": "^8.23.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": "^6.1.2"
  auth0: "^7.6.0"
  better-auth: "^1.7.13"
  drizzle-orm: "^0.45.4"
  lucide-react: "^1.61.0"
  nitro: "npm:nitro-nightly@3.0.1-20260223-102354-c0b46421"
  pg: "^8.23.1"
  pg-boss: "^12.38.0"
  png-to-ico: "^3.0.2"
  posthog-js: "^1.438.21"
  posthog-node: "^5.57.1"
  react: "^19.3.1"
  react-dom: "^19.3.1"
  react-icons: "^5.7.0"
  react-markdown: "^10.1.0"
  recharts: "^3.10.1"
  remark-gfm: "^4.0.1"
  stripe: "^23.0.1"
  tailwindcss: "^4.3.3"
  tslib: "^2.8.1"
  tsx: "^4.23.15"
  tw-animate-css: "^1.4.0"
  typescript: "^7.0.2"
  vite: "^8.3.5"
  vitest: "^5.0.5"
  zod: "^4.6.7"

publicHoistPattern:
  - "@takumi-rs/core-*"

overrides:
  # GHSA-67mh-4wv8-2f99 (drizzle-kit's @esbuild-kit loader asks for the 0.18 line) and
  # GHSA-g7r4-m6w7-qqqr (dev-server arbitrary file read on Windows).
  esbuild: "^0.28.1"
  seroval: "~1.6.11" # GHSA-97r2-qh9m-474h and five more; 1.7.x currently fails trustPolicy
  uuid: "^14.0.2" # GHSA-w5hq-g745-h8pq; also anchors the direct dep in apps/web
  # The bruno CLI is the only thing pulling these in, and only for the e2e API suite.
  form-data: "^4.0.6" # GHSA-hmw2-7cc7-3qxx
  axios: "^1.18.0" # GHSA-gcfj-64vw-6mp9, GHSA-xj6q-8x83-jv6g, and seven more
  "@faker-js/faker": "^10.4.1" # GHSA-qxc2-j82w-r537
  csv-parse: "^7.0.2" # GHSA-8cw4-87c7-c6xx
  # @usebruno/cli pins these exactly; only the e2e API suite pulls them in.
  "js-yaml@^4": "^4.3.2" # GHSA-2883-xcg3-v3hh
  "yaml@^2": "^2.8.3" # GHSA-48c2-rrv3-qjmp
  # @tailwindcss/typography pins 6.0.10, and the fix only exists on the 7 line.
  postcss-selector-parser: "^7.1.6" # GHSA-rj75-hqrm-r3gf
  "@vercel/cli-config>zod": "^4.6.6" # GHSA-mrhx-c7xc-m3w5; every @vercel/cli-config release pins zod exactly
  # @azure/identity caps msal-node below the fix. Only bruno and unstorage's unused Azure driver pull it in.
  "@azure/identity>@azure/msal-node": "^7.1.0" # GHSA-xcx6-jx8p-x3h5

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  msgpackr-extract: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  "@sentry/cli": true # postinstall downloads the sentry-cli binary
  "@scarf/scarf": false
  "@tree-sitter-grammars/tree-sitter-yaml": false
  core-js: false
  core-js-pure: false
  msw: false
  protobufjs: false
  tree-sitter: false
  tree-sitter-json: false
  # Optional peers of better-auth/drizzle-orm for adapters we don't use; we
  # only ever talk to Postgres, so neither native build is needed.
  "@prisma/client": false
  better-sqlite3: false
  # Scalar's reference renderer is Vue under the hood. vue-demi's postinstall
  # only re-points its shim at the installed Vue major, and it ships built for
  # Vue 3 already, which is the only Vue in this tree.
  vue-demi: false

blockExoticSubdeps: true
minimumReleaseAge: 5760
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
