packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

publicHoistPattern:
  - "@takumi-rs/core-*"

overrides:
  "@types/react": "^19.2.14"
  "@types/react-dom": "^19.2.3"
  "glob>minimatch": "^10.2.5"
  brace-expansion: "^5.0.7"
  "cheerio>undici": "^7.24.0"
  # undici advisories (GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q, GHSA-hm92-r4w5-c3mj,
  # GHSA-pr7r-676h-xcf6, GHSA-35p6-xmwp-9g52, GHSA-g8m3-5g58-fq7m). Scoped per-parent
  # because @vercel/blob is on the v6 line and @brightdata/sdk on the v7 line.
  "@brightdata/sdk>undici": "^7.28.0"
  "@vercel/blob>undici": "^6.27.0"
  kysely: "~0.28.14"
  h3: ">=2.0.1-rc.18"
  h3-v2: "npm:h3@>=2.0.1-rc.18"
  picomatch: "^4.0.4"
  "anymatch>picomatch": "^2.3.2"
  "micromatch>picomatch": "^2.3.2"
  dompurify: "^3.4.11" # GHSA-cmwh-pvxp-8882: ALLOWED_ATTR pollution via setConfig()
  yaml: "^2.8.3"
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  esbuild: "^0.28.1" # GHSA-g7r4-m6w7-qqqr: dev-server arbitrary file read on Windows
  "@tanstack/devtools-vite>launch-editor": "^2.14.1" # GHSA-v6wh-96g9-6wx3: NTLMv2 hash disclosure
  # GHSA-h67p-54hq-rp68: js-yaml quadratic-complexity DoS. Scoped per-parent because the
  # tree carries both the v3 line (read-yaml-file, fixed in 3.15.0) and the v4 line
  # (fumadocs-core; there is no 4.1.2, the fix shipped in 4.3.0).
  "read-yaml-file>js-yaml": "^3.15.0"
  "fumadocs-core>js-yaml": "^4.3.0"
  # v4.1.1 is mature and outside the vulnerable v3 range.
  fast-uri: "^4.1.0"
  form-data: "^4.0.6"
  axios: "^1.18.0"
  # Every @better-auth/* plugin declares `^1.6.x` on @better-auth/core, which
  # semver happily resolves to 1.7 — a second copy of the same types that
  # better-auth@1.6 does not use. Plugin objects then stop being assignable to
  # BetterAuthPlugin and auth.api loses its inferred endpoints. Anchor the
  # family to one core; lift this together with better-auth itself.
  "@better-auth/core": "~1.6.29"
  # Same reason, one level down: core's peers decide how many copies of it the
  # store keeps, and two copies of the same version are as incompatible as two
  # versions. These two pin the peer set so there is exactly one core.
  "@better-fetch/fetch": "^1.3.1"
  "@better-auth/utils": "0.4.2"
  jose: "6.2.9"
  uuid: "^14.0.2"
  shell-quote: "^1.8.5"
  ws: "^8.20.1"
  protobufjs: "^7.5.8"
  # Keep one fumadocs-core copy across apps/www and packages/docs (a peer dep there).
  # Without this anchor, bumping fumadocs-core in www alone leaves @workspace/docs on a
  # stale version and the two PageTree types clash at the docs-page-layout boundary.
  fumadocs-core: "^16.9.1"

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  msgpackr-extract: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  "@sentry/cli": true # postinstall downloads the sentry-cli binary
  "@scarf/scarf": false
  "@tree-sitter-grammars/tree-sitter-yaml": false
  core-js: false
  core-js-pure: false
  msw: false
  protobufjs: false
  tree-sitter: false
  tree-sitter-json: false
  # Pulled in by @better-auth/cli (schema generation); we only use its drizzle
  # generator, so neither package's native/postinstall build is needed.
  "@prisma/client": false
  better-sqlite3: false

blockExoticSubdeps: true
minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - nitro
  - srvx
  - vite
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
